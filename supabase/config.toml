# Supabase project configuration used by local tooling and CI/CD.
# Production project ref is supplied by the deployment workflow, not stored here.

[functions.st-api]
# st-api validates user JWTs in authOnly() and protects the scheduled outbox
# route with ST_WORKER_SECRET. Disable the platform's legacy JWT gate so the
# pg_net worker can call the function using an API key in the apikey header.
verify_jwt = false
