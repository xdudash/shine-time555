name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run contract tests
        run: npm test
      - name: Run build
        run: npm run build
      - name: Syntax check
        run: npm run check
      - name: Verify generated service worker
        run: git diff --exit-code -- sw.js
