name: Deploy st-api to Supabase

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm production deploy of st-api build 2026-10-12-stage1"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: production-st-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy st-api v14
    runs-on: ubuntu-latest
    steps:
      - name: Guard production target
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch only."
            exit 1
          fi
          if [[ "$CONFIRM_PRODUCTION" != "true" ]]; then
            echo "::error::Production deployment was not confirmed."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Check JavaScript syntax
        run: npm run check

      - name: Verify generated service worker is committed
        run: git diff --exit-code -- sw.js

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Deploy st-api to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          supabase functions deploy st-api --project-ref qbbtroiqioufuucrqair --use-api
